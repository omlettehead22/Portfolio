name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs to publish to Pages; nothing here needs to write to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish, and only queue the newest one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # the site is served from https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
